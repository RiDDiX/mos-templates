# UniversalLocal RMM for MOS, based on docker/compose.yml of RiDDiX/ulrmm.
# Every setting comes from .env. The data sits in bind mounts under
# ULRMM_DATA, because MOS runs "docker-compose down -v" when a stack is
# edited or removed, and that would delete named volumes.

x-api-env: &api-env
  ULRMM_LOG_TO: stdout
  ULRMM_LOG_LEVEL: ${ULRMM_LOG_LEVEL:-INFO}
  NATS_STD_BIND_HOST: 0.0.0.0
  NATS_WS_BIND_HOST: 0.0.0.0
  NATS_CONNECT_HOST: nats
  TZ: ${TZ:-UTC}
  API_DOMAIN: ${API_DOMAIN:?}
  APP_DOMAIN: ${APP_DOMAIN:?}
  MESH_DOMAIN: ${MESH_DOMAIN:?}
  MESH_USERNAME: ${MESH_USERNAME:-ulrmm-mesh}

x-api-depends: &api-depends
  init:
    condition: service_completed_successfully
  nats:
    condition: service_started
  redis:
    condition: service_healthy
  db:
    condition: service_healthy

services:
  # new bind mounts belong to root, the ulrmm images run as uid 1000
  perms:
    image: ghcr.io/riddix/ulrmm-api:${ULRMM_VERSION:?}
    restart: "no"
    user: "0:0"
    working_dir: /data
    command:
      - sh
      - -c
      - >-
        mkdir -p settings conf certs mesh agent-ca agents-dist scripts-lib static private/log private/exe &&
        chown 1000:1000 settings conf certs mesh agent-ca agents-dist scripts-lib static private private/log private/exe
    volumes:
      - ${ULRMM_DATA:-./data}:/data

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ulrmm
      POSTGRES_DB: ulrmm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      MESH_DB_PASSWORD: ${MESH_DB_PASSWORD:?}
      TZ: ${TZ:-UTC}
    configs:
      - source: init-mesh
        target: /docker-entrypoint-initdb.d/init-mesh.sh
    volumes:
      - ${ULRMM_DATA:-./data}/db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulrmm -d ulrmm"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--save", "60", "1"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - ${ULRMM_DATA:-./data}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.14.4-alpine
    restart: unless-stopped
    command: ["sh", "/reload-watch.sh"]
    configs:
      - source: nats-reload
        target: /reload-watch.sh
    volumes:
      - ${ULRMM_DATA:-./data}/conf:/conf:ro
    depends_on:
      init:
        condition: service_completed_successfully

  natsapi:
    image: ghcr.io/riddix/ulrmm-natsapi:${ULRMM_VERSION:?}
    restart: unless-stopped
    command: ["/usr/local/bin/nats-api", "-config", "/conf/nats-api.conf"]
    volumes:
      - ${ULRMM_DATA:-./data}/conf:/conf:ro
    depends_on:
      init:
        condition: service_completed_successfully
      nats:
        condition: service_started
      db:
        condition: service_healthy

  mesh:
    image: ghcr.io/riddix/ulrmm-mesh:${ULRMM_VERSION:?}
    restart: unless-stopped
    environment:
      MESH_DOMAIN: ${MESH_DOMAIN:?}
      MESH_DB_PASSWORD: ${MESH_DB_PASSWORD:?}
      MESH_USERNAME: ${MESH_USERNAME:-ulrmm-mesh}
      MESH_PASSWORD: ${MESH_PASSWORD:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      TZ: ${TZ:-UTC}
    volumes:
      - ${ULRMM_DATA:-./data}/mesh:/meshcentral/meshcentral-data
    depends_on:
      perms:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  init:
    image: ghcr.io/riddix/ulrmm-api:${ULRMM_VERSION:?}
    restart: "no"
    command: ["/init.sh"]
    environment:
      <<: *api-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      ULRMM_TLS: ${ULRMM_TLS:-own}
      ULRMM_SCRIPTS_REPO: ${ULRMM_SCRIPTS_REPO:-https://github.com/RiDDiX/ulrmm-scripts.git}
      ULRMM_SCRIPTS_TOKEN: ${ULRMM_SCRIPTS_TOKEN:-}
      ULRMM_AGENT_REPO: ${ULRMM_AGENT_REPO:-https://github.com/RiDDiX/ulrmm-agent.git}
    volumes:
      - ${ULRMM_DATA:-./data}/settings:/settings
      - ${ULRMM_DATA:-./data}/conf:/conf
      - ${ULRMM_DATA:-./data}/private:/rmm/api/ulrmm/ulrmm/private
      - ${ULRMM_DATA:-./data}/agent-ca:/etc/ulrmm/agent-ca
      - ${ULRMM_DATA:-./data}/scripts-lib:/opt/ulrmm-community-scripts
      - ${ULRMM_DATA:-./data}/static:/rmm/api/ulrmm/static
      - ${ULRMM_DATA:-./data}/mesh:/mesh-data:ro
      - ${ULRMM_DATA:-./data}/certs:/certs:ro
    depends_on:
      perms:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mesh:
        condition: service_started

  api:
    image: ghcr.io/riddix/ulrmm-api:${ULRMM_VERSION:?}
    restart: unless-stopped
    command: ["uwsgi", "--ini", "/rmm/docker/uwsgi.ini"]
    environment:
      <<: *api-env
      UWSGI_WORKERS: ${UWSGI_WORKERS:-6}
    volumes:
      - ${ULRMM_DATA:-./data}/settings:/settings:ro
      - ${ULRMM_DATA:-./data}/conf:/conf
      - ${ULRMM_DATA:-./data}/private:/rmm/api/ulrmm/ulrmm/private
      - ${ULRMM_DATA:-./data}/agent-ca:/etc/ulrmm/agent-ca
      - ${ULRMM_DATA:-./data}/agents-dist:/opt/ulrmm-agents:ro
      - ${ULRMM_DATA:-./data}/scripts-lib:/opt/ulrmm-community-scripts
      - ${ULRMM_DATA:-./data}/certs:/certs:ro
    depends_on: *api-depends

  ws:
    image: ghcr.io/riddix/ulrmm-api:${ULRMM_VERSION:?}
    restart: unless-stopped
    command: ["uvicorn", "--host", "0.0.0.0", "--port", "8001", "--forwarded-allow-ips=*", "--no-access-log", "ulrmm.asgi:application"]
    environment: *api-env
    volumes:
      - ${ULRMM_DATA:-./data}/settings:/settings:ro
      - ${ULRMM_DATA:-./data}/conf:/conf
      - ${ULRMM_DATA:-./data}/private:/rmm/api/ulrmm/ulrmm/private
      - ${ULRMM_DATA:-./data}/agent-ca:/etc/ulrmm/agent-ca:ro
      - ${ULRMM_DATA:-./data}/agents-dist:/opt/ulrmm-agents:ro
      - ${ULRMM_DATA:-./data}/certs:/certs:ro
    depends_on: *api-depends

  celery:
    image: ghcr.io/riddix/ulrmm-api:${ULRMM_VERSION:?}
    restart: unless-stopped
    command: ["celery", "-A", "ulrmm", "worker", "--time-limit=86400", "--autoscale=20,2", "-l", "info"]
    environment: *api-env
    volumes:
      - ${ULRMM_DATA:-./data}/settings:/settings:ro
      - ${ULRMM_DATA:-./data}/conf:/conf
      - ${ULRMM_DATA:-./data}/private:/rmm/api/ulrmm/ulrmm/private
      - ${ULRMM_DATA:-./data}/agent-ca:/etc/ulrmm/agent-ca
      - ${ULRMM_DATA:-./data}/agents-dist:/opt/ulrmm-agents:ro
      - ${ULRMM_DATA:-./data}/scripts-lib:/opt/ulrmm-community-scripts
      - ${ULRMM_DATA:-./data}/certs:/certs:ro
    depends_on: *api-depends

  celerybeat:
    image: ghcr.io/riddix/ulrmm-api:${ULRMM_VERSION:?}
    restart: unless-stopped
    command: ["celery", "-A", "ulrmm", "beat", "-s", "/tmp/celerybeat-schedule", "-l", "info"]
    environment: *api-env
    volumes:
      - ${ULRMM_DATA:-./data}/settings:/settings:ro
      - ${ULRMM_DATA:-./data}/conf:/conf:ro
    depends_on: *api-depends

  # builds the Linux and macOS agents into agents-dist, see .env.
  # Windows installers need Inno Setup and are not built in the container.
  agents:
    image: ghcr.io/riddix/ulrmm-api:${ULRMM_VERSION:?}
    profiles: ["agents"]
    restart: "no"
    working_dir: /rmm
    command: ["bash", "riddix/agents/build_agents.sh"]
    environment:
      <<: *api-env
      ULRMM_AGENT_ROOT: /opt/ulrmm-agents
    volumes:
      - ${ULRMM_DATA:-./data}/settings:/settings:ro
      - ${ULRMM_DATA:-./data}/agents-dist:/opt/ulrmm-agents
    depends_on:
      init:
        condition: service_completed_successfully

  nginx:
    image: ghcr.io/riddix/ulrmm-nginx:${ULRMM_VERSION:?}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
      APP_DOMAIN: ${APP_DOMAIN:?}
      MESH_DOMAIN: ${MESH_DOMAIN:?}
      ROOT_DOMAIN: ${ROOT_DOMAIN:?}
      ULRMM_TLS: ${ULRMM_TLS:-own}
      TZ: ${TZ:-UTC}
    volumes:
      - ${ULRMM_DATA:-./data}/certs:/certs
      - ${ULRMM_DATA:-./data}/agent-ca:/etc/ulrmm/agent-ca:ro
      - ${ULRMM_DATA:-./data}/private:/rmm/api/ulrmm/ulrmm/private:ro
      - ${ULRMM_DATA:-./data}/agents-dist:/opt/ulrmm-agents:ro
      - ${ULRMM_DATA:-./data}/static:/rmm/api/ulrmm/static:ro
    networks:
      default:
        # api, celery and mesh reach the public names inside the stack
        aliases:
          - ${API_DOMAIN:?}
          - ${APP_DOMAIN:?}
          - ${MESH_DOMAIN:?}
    depends_on:
      init:
        condition: service_completed_successfully
      api:
        condition: service_started
      ws:
        condition: service_started
      mesh:
        condition: service_started
      nats:
        condition: service_started

# MOS copies only compose.yaml and .env into the stack folder, so the two
# helper scripts of docker/ in the ulrmm repo live here
configs:
  # postgres initdb hook, runs once on an empty data directory
  init-mesh:
    content: |
      psql -v ON_ERROR_STOP=1 -v pw="$$MESH_DB_PASSWORD" --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<'EOSQL'
      CREATE ROLE meshcentral LOGIN PASSWORD :'pw';
      CREATE DATABASE meshcentral OWNER meshcentral;
      EOSQL
  # Django rewrites nats-rmm.conf and cannot signal nats-server in another
  # container, so this watches the file and sends HUP on change
  nats-reload:
    content: |
      set -eu
      conf=/conf/nats-rmm.conf
      until [ -f "$$conf" ]; do
        sleep 3
      done
      nats-server -c "$$conf" &
      pid=$$!
      trap 'kill -TERM "$$pid" 2>/dev/null' TERM INT
      sum=$$(sha256sum "$$conf")
      while kill -0 "$$pid" 2>/dev/null; do
        sleep 3
        new=$$(sha256sum "$$conf" 2>/dev/null || true)
        if [ -n "$$new" ] && [ "$$new" != "$$sum" ]; then
          sum=$$new
          kill -HUP "$$pid"
        fi
      done
      wait "$$pid"
